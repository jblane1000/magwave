[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magwave"
version = "0.1.0"
description = "Open-source 3D magnetic field simulator for permanent magnets, coils and steel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jason", email = "jblane1000@users.noreply.github.com" }]
keywords = ["magnetostatics", "magnetics", "electromagnetics", "CAD", "simulation", "physics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core only: must import without Qt, without gmsh, without Elmer.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "magpylib>=6,<7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyvista>=0.43", "pytest-qt>=4.4"]
step = ["cadquery-ocp>=8.0.1.1.0,<9"]
mesh = ["trimesh>=5.2,<6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
magwave = "magwave.cli:main"

[project.urls]
Homepage = "https://github.com/jblane1000/magwave"
Issues = "https://github.com/jblane1000/magwave/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magwave = ["py.typed", "benchmarks/*.json", "materials/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# docs/ holds illustrative snippets inside prose and the research reference file, which is
# research-owned and not reformatted by tooling; the lint section already exempts it.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Deterministic checks are the primary review layer for engine-authored code. E/F catch
# undefined names, B catches the classic agent mistakes, ARG catches dead parameters,
# RUF catches stale `# noqa` and mis-sorted `__all__`, S is a security fence for future
# code, TID enforces the module boundary below.
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF", "TID", "S"]
ignore = [
    "E501",     # long doc lines acceptable; ruff format handles line-length
    "RUF001",   # unicode in prose is deliberate (en dashes, units like µm)
    "RUF002",
    "RUF003",
    "S101",     # assert is how internal invariants are checked in this codebase
    "S603",     # subprocess without shell=True is how gmsh/Elmer are driven
    "S607",     # partial executable paths for those same tools
    "TID252",   # relative imports inside a package are deliberate
    "RUF007",   # `zip(xs, xs[1:], strict=False)` states the intent better than pairwise
]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["ALL"]
# Declared boundaries, not silenced violations: these are exactly the two modules the
# architecture says may touch the optional dependencies.
"src/magwave/gui.py" = ["TID251"]      # Qt boundary
"src/magwave/cad/**" = ["TID251"]      # OCP boundary
"tests/**" = ["ARG001", "ARG002", "TID251"]  # tests may exercise the boundaries

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Architecture, not advice: the core must stay Qt-free and OCP-free so the library
# installs and imports without the `gui` / CAD extras. CI proved this by installing
# core alone, which failed five minutes later and in a different job; this refuses the
# import on the line where it is written. Add a path here only for a declared boundary
# module, never to silence one violation.
"PySide6".msg = "GUI boundary: import Qt only in src/magwave/gui.py, so core stays Qt-free (NFR-3)"
"OCP".msg = "CAD boundary: import OCP only in magwave.cad.*, so core stays OCP-free (NFR-3)"
